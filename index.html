<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>مشوار القاهرة — Cairo Rush</title>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@500;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--ink:#0b0e14;--glass:rgba(12,16,24,.55);--line:rgba(255,255,255,.2);--tuk:#f4c20d;--clay:#e5483a;--grn:#27c46b;--blue:#2f7cff;
--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--ink);color:#fff;font-family:"Tajawal",Tahoma,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#fl{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none}
body:not(.playing) .g{display:none!important}
button{font-family:inherit;color:inherit}
/* تحميل */
#loading{position:fixed;inset:0;background:radial-gradient(circle at 50% 40%,#1c2433,#07090d);display:grid;place-items:center;z-index:20;text-align:center;transition:opacity .5s}
#loading.off{opacity:0;pointer-events:none}
.ld b{display:block;font:400 9vmin Lalezar,sans-serif;color:var(--tuk)}.ld span{opacity:.8}
/* الأزرار الصغيرة فوق */
#bar{position:fixed;top:calc(var(--st) + 2vmin);left:50%;transform:translateX(-50%);display:flex;gap:1.6vmin;z-index:5}
.rb{width:11vmin;height:11vmin;max-width:56px;max-height:56px;border-radius:50%;border:1.5px solid var(--line);background:var(--glass);backdrop-filter:blur(6px);font-size:4.6vmin;padding:0}
.rb.off{opacity:.45}
#zn{position:fixed;top:calc(var(--st) + 14.5vmin);left:50%;transform:translateX(-50%);font-weight:800;font-size:3.2vmin;text-shadow:0 1px 6px #000;pointer-events:none}
#msg{position:fixed;top:calc(var(--st) + 1px);left:50%;transform:translateX(-50%);padding:.4vmin 2.4vmin;font:800 3vmin Tajawal;border-radius:2vmin;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;z-index:9;background:rgba(12,16,24,.8)}
/* يمين فوق: اللافتة + الماب */
#sign{position:fixed;top:calc(var(--st) + 2vmin);right:calc(var(--sr) + 2.5vmin);width:44vmin;max-width:240px;padding:1.2vmin 2vmin;background:linear-gradient(#1b4fa0,#153b7a);border:.5vmin solid #fff;border-radius:1.6vmin;line-height:1.3}
#sign small{display:block;font-size:2.6vmin;opacity:.85}#sign strong{display:block;font-size:4.6vmin}#sign b{color:var(--tuk);font-size:4.2vmin}
#mini{position:fixed;top:calc(var(--st) + 25vmin);right:calc(var(--sr) + 4vmin);width:25vmin;height:25vmin;border-radius:50%;overflow:hidden;border:.6vmin solid rgba(255,255,255,.85);background:#222;box-shadow:0 0 0 .5vmin rgba(0,0,0,.35)}
#mmrot{position:absolute;width:170%;height:170%;left:-35%;top:-35%;transition:transform .25s linear}
#mmap{width:100%;height:100%;background:#e6dfcb}
#mini.nt .leaflet-tile-pane{filter:brightness(.9)}
#marrow{position:absolute;left:50%;top:50%;width:0;height:0;margin:-2.4vmin 0 0 -1.6vmin;border-left:1.6vmin solid transparent;border-right:1.6vmin solid transparent;border-bottom:4.8vmin solid var(--tuk);filter:drop-shadow(0 0 2px #000);z-index:900}
#mcr{position:absolute;bottom:.6vmin;left:0;right:0;text-align:center;font-size:1.8vmin;opacity:.7;z-index:900;text-shadow:0 0 3px #fff;color:#222}
.poi{font-size:3.4vmin;text-align:center;line-height:1;filter:drop-shadow(0 1px 2px #000)}
/* يسار فوق */
#hudL{position:fixed;top:calc(var(--st) + 2vmin);left:calc(var(--sl) + 2.5vmin);display:grid;gap:1vmin}
.pill{display:flex;align-items:baseline;gap:1.4vmin;padding:.6vmin 2vmin;background:var(--glass);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:1.8vmin}
.pill i{font-style:normal;font-size:2.6vmin;opacity:.75}.pill b{font:400 5.4vmin Lalezar,sans-serif;color:var(--tuk)}
/* لوحة العدادات تحت في النص */
#dash{position:fixed;left:50%;bottom:calc(var(--sb) + 2vmin);transform:translateX(-50%);text-align:center;pointer-events:none;width:40vmin}
#spd{line-height:1}#spd b{font:italic 400 17vmin Lalezar,sans-serif;text-shadow:0 .4vmin 2vmin #000;letter-spacing:-.3vmin}#spd i{font-style:normal;font-size:3vmin;opacity:.85;margin-inline-start:1vmin}
#gw{display:flex;align-items:center;gap:1.6vmin;justify-content:center;margin:.4vmin 0 1vmin}
#gear{width:6.4vmin;height:6.4vmin;border-radius:1.2vmin;background:var(--tuk);color:#111;font:400 5vmin Lalezar,sans-serif;display:grid;place-items:center}
#rpm{flex:1;height:2vmin;border-radius:1vmin;background:rgba(255,255,255,.18);overflow:hidden}
#rpmf{display:block;height:100%;width:20%;background:linear-gradient(90deg,#27c46b,#f4c20d 65%,#e5483a)}
#bars{display:grid;grid-template-columns:repeat(3,1fr);gap:1.6vmin;font-size:2.4vmin}
#bars span{display:block;text-align:start}#bars s{display:block;height:1.2vmin;border-radius:1vmin;background:var(--tuk);margin-top:.4vmin;width:100%;transition:width .2s}
#bars span:nth-child(2) s{background:#5ad17a}#bars span:nth-child(3) s{background:var(--blue)}
/* أزرار التحكم */
.btn{position:fixed;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6vmin;border:1.5px solid var(--line);background:var(--glass);backdrop-filter:blur(6px);border-radius:3vmin;padding:0;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;font:800 3vmin Tajawal;transition:transform .06s,background .1s,box-shadow .1s;z-index:4}
.btn svg{width:42%;height:auto;max-height:46%;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.btn span{pointer-events:none}
.btn.on{transform:scale(.94)}
#lb,#rb{width:22vmin;height:22vmin;bottom:calc(var(--sb) + 3vmin);border-radius:50%;background:rgba(255,255,255,.14)}
#lb{left:calc(var(--sl) + 3vmin)}#rb{left:calc(var(--sl) + 27vmin)}
#lb svg,#rb svg{width:46%;stroke-width:2.6}
#lb.on,#rb.on{background:rgba(255,255,255,.4)}
#gs{right:calc(var(--sr) + 3vmin);bottom:calc(var(--sb) + 3vmin);width:19vmin;height:38vmin}
#gs.on{background:rgba(39,196,107,.65);box-shadow:0 0 3vmin rgba(39,196,107,.7)}
#bk{right:calc(var(--sr) + 25vmin);bottom:calc(var(--sb) + 3vmin);width:19vmin;height:27vmin}
#bk.on{background:rgba(229,72,58,.7);box-shadow:0 0 3vmin rgba(229,72,58,.7)}
#hb{right:calc(var(--sr) + 25vmin);bottom:calc(var(--sb) + 32vmin);width:19vmin;height:12vmin;flex-direction:row;font-size:2.6vmin;border-radius:2.4vmin}
#hb svg{width:30%}#hb.on{background:rgba(255,160,40,.7)}
#ni{right:calc(var(--sr) + 3vmin);bottom:calc(var(--sb) + 43vmin);width:19vmin;height:13vmin;flex-direction:row;font-size:2.6vmin;border-radius:2.4vmin;background:rgba(47,124,255,.35)}
#ni svg{width:26%;stroke:#8fc0ff}#ni.on{background:rgba(47,124,255,.85);box-shadow:0 0 3vmin rgba(47,124,255,.8)}
/* خريطة كاملة */
#big{position:fixed;inset:0;background:#0b0e14;z-index:12;display:flex;flex-direction:column}
#bmap{flex:1;min-height:0}#bnote{padding:1vmin 2vmin;font-size:3vmin;text-align:center}
#bx2{margin:1.4vmin auto;padding:1.6vmin 6vmin;border:0;border-radius:2vmin;background:var(--tuk);color:#111;font:400 4.4vmin Lalezar,sans-serif;z-index:1000}
.zlab{font:800 3vmin Tajawal,sans-serif;color:#fff;text-align:center;text-shadow:0 0 4px #000,0 0 4px #000;white-space:nowrap}
.ltip{font:800 2.8vmin Tajawal,sans-serif;background:rgba(255,255,255,.9);border:0;color:#222;padding:0 1vmin}
/* كارت البداية */
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(7,9,13,.55);backdrop-filter:blur(4px);padding:2vmin;z-index:10}
.card{background:linear-gradient(#141b27,#0b0e14);border:.4vmin solid var(--tuk);border-radius:3vmin;padding:3vmin 4vmin;width:min(560px,94vw);max-height:96vh;overflow:auto;text-align:center}
.card h1{font:400 8vmin/1.1 Lalezar,sans-serif;margin:0 0 1vmin;color:var(--tuk)}.card p{margin:.6vmin 0 1.6vmin;line-height:1.6;font-size:3.2vmin}
.row{display:flex;align-items:center;justify-content:space-between;gap:2vmin;margin:0 0 1.2vmin}.row label{font-weight:800;font-size:3.2vmin;text-align:start}
.opt{display:flex;gap:1vmin}.opt button{padding:1.2vmin 2.4vmin;border-radius:1.6vmin;border:.3vmin solid #f2a33a;background:transparent;font-weight:800;font-size:3vmin}
.opt button.on{background:#f2a33a;color:#111}
#go{width:100%;margin-top:1vmin;padding:2vmin;border:0;border-radius:2vmin;background:var(--tuk);color:#111;font:400 6vmin Lalezar,sans-serif}
.card small{display:block;margin-top:1.4vmin;opacity:.7;font-size:2.6vmin}
/* لف الموبايل */
#rot{position:fixed;inset:0;background:#0b0e14;color:var(--tuk);display:none;align-items:center;justify-content:center;text-align:center;padding:20px;z-index:30;font:400 9vmin Lalezar,sans-serif}
#rot{display:none!important}
@media (orientation:portrait){
#bar{top:calc(var(--st) + 21vmin);left:auto;right:calc(var(--sr) + 3vmin);transform:none}
#mini{top:calc(var(--st) + 36vmin)}
#dash{top:calc(var(--st) + 28vmin);bottom:auto;left:calc(var(--sl) + 3vmin);transform:none;width:44vmin;text-align:start}
#zn{top:auto;bottom:calc(var(--sb) + 60vmin)}#fps{top:calc(var(--st) + 62vmin)}
#hudL .pill b{font-size:6vmin}.card h1{font-size:12vmin}.card p{font-size:4vmin}.row label,.opt button{font-size:4vmin}
}
body:not(.playing) #ov{background:linear-gradient(rgba(7,9,13,.5),rgba(7,9,13,.82)),repeating-linear-gradient(100deg,#141b27 0 40px,#10151f 40px 80px)}
.menu{display:flex;flex-direction:column;gap:1.4vmin}.mtop{display:flex;justify-content:space-between;gap:8px}
#mcar{background:linear-gradient(#202a3a,#10151f);border:1px solid #2a3142;border-radius:3vmin;padding:1vmin 2vmin}
#mcar svg{width:min(60vmin,70%);height:auto;max-height:22vmin}#mcar b{display:block;font:400 5vmin Lalezar,sans-serif;color:#ffd21e}#mcar small{margin:0!important}
.mrow{display:flex;gap:1.4vmin}.mrow button{flex:1;margin:0!important;padding:1.6vmin 1vmin!important;border-radius:2vmin;border:.3vmin solid #f2a33a;background:#1b2535;font:800 3.2vmin Tajawal}
#dl:disabled{opacity:.5}#sp{padding:1vmin 0}
@media (orientation:portrait){.mrow button{font-size:4vmin}#mcar b{font-size:7vmin}}
#fps{position:fixed;top:calc(var(--st) + 19vmin);left:50%;transform:translateX(-50%);font:800 2.6vmin ui-monospace,monospace;color:#7dffb0;text-shadow:0 1px 4px #000;pointer-events:none}
.badge{display:inline-block;margin:0 0 1.2vmin;padding:.4vmin 2vmin;border-radius:2vmin;background:linear-gradient(90deg,#27c46b,#f4c20d);color:#111;font:800 2.8vmin Tajawal,sans-serif;letter-spacing:.2vmin}


#gar{position:fixed;inset:0;z-index:15;background:radial-gradient(circle at 50% 0,#1d2432,#0b0e14 60%);overflow-y:auto;overflow-x:hidden;touch-action:pan-y;-webkit-overflow-scrolling:touch;padding:calc(var(--st) + 12px) 14px calc(var(--sb) + 24px)}
#gar>div{max-width:720px;margin:auto}#gar header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
#gar h2{font:400 34px/1 Lalezar,sans-serif;color:#ffd21e;margin:0}#gar header small{opacity:.7;font-weight:800}
.gcoin{margin-inline-start:auto;background:#161b26;border:1px solid #2a3142;border-radius:20px;padding:6px 14px;font-weight:800;color:#ffd21e}
#gback{width:44px;height:44px;border-radius:50%;border:1px solid #2a3142;background:#161b26;font-size:20px}
#gtabs,#gcols{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
#gtabs button{padding:9px 18px;border-radius:20px;border:1px solid #2a3142;background:#161b26;font:800 15px Tajawal}
#gtabs button.on{background:#ffd21e;color:#111;border-color:#ffd21e}
#gprev{background:linear-gradient(#202a3a,#10151f);border:1px solid #2a3142;border-radius:18px;padding:10px 14px;text-align:center}
#gprev svg{width:min(380px,90%);height:auto}#gprev .st{display:flex;justify-content:space-between;font-weight:800;margin-top:4px}#gprev b{font:400 24px Lalezar,sans-serif;color:#ffd21e}
#gcols button{width:42px;height:42px;border-radius:50%;border:3px solid transparent;padding:0}#gcols button.on{border-color:#ffd21e;box-shadow:0 0 0 2px #0b0e14 inset}
.up{display:flex;align-items:center;gap:10px;background:#12171f;border:1px solid #2a3142;border-radius:14px;padding:10px 12px;margin-bottom:8px}
.up div{flex:1}.up b{display:block;font-size:17px}.up small{opacity:.8}.dots{display:flex;gap:3px;margin-top:5px}.dots i{width:14px;height:7px;border-radius:4px;background:#2a3142}.dots i.f{background:#ffd21e}
.up button,#guse{border:0;border-radius:12px;background:#ffd21e;color:#111;font:800 15px Tajawal;padding:10px 14px}.up button:disabled{opacity:.4}
#guse{display:block;width:100%;margin:12px 0;padding:14px;background:#1f7a3a;color:#fff;font-size:18px}
#ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.gc{position:relative;border-radius:14px;padding:8px 6px;text-align:center;background:#12171f;border:2px solid #2a3142;font-weight:800;font-size:14px}
.gc.own{background:linear-gradient(#0f3f8f,#0b2a63);border-color:#fff}.gc.cur{border-color:#ffd21e;box-shadow:0 0 14px rgba(255,210,30,.5)}
.gc svg{width:100%;height:46px}.gc.lk svg{filter:grayscale(1) brightness(.5)}.gc em{display:block;font-style:normal;margin-top:4px;padding:3px;border-radius:8px;background:rgba(0,0,0,.4);font-size:12px}
.gc.own em{color:#7df0b0}.gc.lk em{color:#ffd21e}
#gb,#lg{margin:0 0 1.2vmin;padding:1.4vmin 3vmin;border-radius:2vmin;border:.3vmin solid #f2a33a;background:transparent;font:800 3.2vmin Tajawal}#gb{width:100%;background:#1b2535}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="fl"></div>

<!-- شاشة التحميل -->
<div id="loading"><div class="ld"><b>مشوار القاهرة · Cairo Rush</b><span id="lt">جاري التحميل…</span></div></div>

<!-- الواجهة أثناء اللعب -->
<div id="hudL" class="g">
  <div class="pill"><i>الوقت</i><b id="tm">300</b></div>
  <div class="pill"><i>تعديات</i><b id="ov2">0</b></div>
  <div class="pill"><i>لفة</i><b id="km">1</b></div>
</div>
<div id="bar" class="g">
  <button class="rb" id="ps" aria-label="إيقاف">❚❚</button>
  <button class="rb" id="mp" aria-label="الخريطة">🗺</button>
  <button class="rb" id="tn" aria-label="نهار/ليل">☀️</button>
  <button class="rb" id="hn" aria-label="كلاكس">📢</button>
</div>
<div id="zn" class="g"></div>
<div id="fps" class="g">-- FPS</div>
<div id="msg"></div>
<div id="sign" class="g"><small>الجاية</small><strong id="sn">—</strong><b id="sk">0.0 كم</b></div>
<div id="mini" class="g"><div id="mmrot"><div id="mmap"></div></div><i id="marrow"></i><span id="mcr">© OSM</span></div>
<div id="dash" class="g">
  <div id="spd"><b id="sp">0</b><i>كم/س</i></div>
  <div id="gw"><div id="gear">1</div><div id="rpm"><u id="rpmf"></u></div></div>
  <div id="bars"><span>بنزين<s id="fu"></s></span><span>الحالة<s id="dm"></s></span><span>نايترو<s id="nt"></s></span></div>
</div>

<!-- أزرار التحكم: شمال = التوجيه / يمين = البنزين والفرامل والهاند والنايترو -->
<button class="btn g" id="lb" aria-label="شمال"><svg viewBox="0 0 24 24"><path d="M15 4 7 12l8 8"/></svg></button>
<button class="btn g" id="rb" aria-label="يمين"><svg viewBox="0 0 24 24"><path d="m9 4 8 8-8 8"/></svg></button>
<button class="btn g" id="gs" aria-label="بنزين"><svg viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="3"/><path d="M9.5 7h5M9.5 11h5M9.5 15h5"/></svg><span>بنزين</span></button>
<button class="btn g" id="bk" aria-label="فرامل"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="3"/><path d="M8 10h8M8 14h8"/></svg><span>فرامل</span></button>
<button class="btn g" id="hb" aria-label="هاند"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 16V8h4a2.5 2.5 0 0 1 0 5H9"/></svg><span>هاند</span></button>
<button class="btn g" id="ni" aria-label="نايترو"><svg viewBox="0 0 24 24"><path d="M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-3 2-4 3-7 1 1 2 2 3 5 1-3 0-6 0-10Z"/></svg><span>نايترو</span></button>

<!-- الخريطة الكاملة (OpenStreetMap) -->
<div id="big" hidden><div id="bmap"></div><div id="bnote"></div><button id="bx2">إغلاق الخريطة</button></div>

<!-- كارت البداية + الإعدادات -->
<div id="ov"><div class="card menu">
  <div class="mtop"><span class="gcoin">🪙 <span id="mc"></span></span><span class="gcoin" id="mbest"></span></div>
  <h1 id="t">مشوار القاهرة</h1>
  <div id="mcar"></div>
  <p id="d"></p>
  <button id="go">يلا ابدأ</button>
  <div class="mrow"><button id="gb"></button><button id="dl"></button><button id="sb">⚙</button><button id="lg"></button></div>
  <div id="sp" hidden>
  <div class="row"><label>حساسية التوجيه</label><div class="opt" data-set="sens"><button data-v="0.7">خفيفة</button><button data-v="1">عادية</button><button data-v="1.4">جامدة</button></div></div>
  <div class="row"><label>بنزين</label><div class="opt" data-set="auto"><button data-v="0">يدوي</button><button data-v="1">تلقائي</button></div></div>
  </div>
  <small>كيبورد</small>
</div></div>
<div id="gar" hidden><div>
<header><button id="gback">→</button><div><h2 id="gt"></h2><small id="gsub"></small></div><span class="gcoin">🪙 <span id="gc"></span></span></header>
<div id="gtabs"></div><div id="gprev"></div><div id="gcols"></div><div id="gup"></div><button id="guse"></button><div id="ggrid"></div>
</div></div>
<div id="rot">لفّ الموبايل بالعرض 📱</div>

<script type="text/x-game" id="gsrc">
'use strict';
/* ===== config.js ===== */
/* ============================================================
   config.js — الإعدادات + المسار (حقيقي من OSRM أو احتياطي)
   عدّل هنا: المسار، المناطق، الموديلات، عدد العربيات
   ============================================================ */
const CFG={
  useOSRM:true,                                            // true = مسار حقيقي من خدمة OSRM
  osrm:'https://router.project-osrm.org/route/v1/driving/',
  tiles:{day:'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
         night:'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png'},
  traffic:72,
  // موديلات GLB واقعية الحجم للاستخدام داخل اللعبة. هذه أجسام عامة حسب الفئة
  // وليست نسخًا مرخّصة مطابقة لكل سيارة تحمل اسم شركة بعينها.
  models:{
    tuk:null,
    sedan:{url:'https://www.innerscene.com/api/library/sedan-car-42109739/download',len:4.55},
    taxi:{url:'https://www.innerscene.com/api/library/sedan-car-42109739/download',len:4.55},
    pickup:{url:'https://www.innerscene.com/api/library/generic-compact-suv-9f157ee5/download',len:4.9},
    suv:{url:'https://www.innerscene.com/api/library/generic-compact-suv-9f157ee5/download',len:4.5},

    else if(gas){if(speed<base)speed+=MAX*(.28*(1-pct*pct)+.02)*dt;else if(speed>base)speed=Math.max(base,speed-MAX*.6*dt)}
